<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse by Job Categories</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          screens: {
            xs: '480px',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-white antialiased">

  <!-- Browse by Job Categories Section -->
  <section class="bg-gray-50 py-10 px-4 xs:px-6 sm:py-12 lg:py-16 lg:px-8">
    <div class="max-w-6xl mx-auto">

      <!-- Header -->
      <div class="text-center mb-8 sm:mb-10 lg:mb-12">
        <h2 class="text-2xl xs:text-3xl sm:text-4xl font-extrabold text-slate-800 leading-tight">
          Browse by
          <span class="border-b-[3px] sm:border-b-4 border-orange-500 pb-0.5 sm:pb-1">Job</span>
          Categories
        </h2>
      </div>

      <!--
        Responsive Grid (Tailwind Media Queries):
        - Mobile (<640px)  : 1 column
        - Tablet (≥640px)  : 2 columns
        - Desktop (≥1024px): 4 columns
      -->
      <div class="grid grid-cols-1 xs:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5 lg:gap-6">

        <!-- Digital Marketing -->
        <article class="group bg-white p-4 sm:p-5 lg:p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between min-h-[160px] sm:min-h-[180px] lg:h-56 hover:shadow-md hover:border-orange-200 transition-all duration-200 cursor-pointer">
          <div>
            <img src="assets/categories/digital-marketing.png" alt="Digital Marketing" class="w-10 h-10 sm:w-12 sm:h-12 mb-3 sm:mb-4 object-contain" width="48" height="48" />
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Digital Marketing</h3>
          </div>
          <div class="flex items-center justify-between mt-4 sm:mt-5">
            <p class="text-xs sm:text-sm text-gray-400">143 Jobs Opened</p>
            <span class="text-slate-400 text-base sm:text-lg group-hover:text-slate-600 transition-colors">→</span>
          </div>
        </article>

        <!-- Art & Design -->
        <article class="group bg-white p-4 sm:p-5 lg:p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between min-h-[160px] sm:min-h-[180px] lg:h-56 hover:shadow-md hover:border-orange-200 transition-all duration-200 cursor-pointer">
          <div>
            <div class="w-10 h-10 sm:w-12 sm:h-12 bg-orange-50 rounded-full flex items-center justify-center mb-3 sm:mb-4">
              <svg class="w-5 h-5 sm:w-6 sm:h-6 text-orange-500" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/>
              </svg>
            </div>
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Art &amp; Design</h3>
          </div>
          <div class="flex items-center justify-between mt-4 sm:mt-5">
            <p class="text-xs sm:text-sm text-gray-400">110 Jobs Opened</p>
            <span class="text-slate-400 text-base sm:text-lg group-hover:text-slate-600 transition-colors">→</span>
          </div>
        </article>

        <!-- Accounting (Highlighted) -->
        <article class="group bg-white p-4 sm:p-5 lg:p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between min-h-[160px] sm:min-h-[180px] lg:h-56 hover:shadow-md hover:border-orange-200 transition-all duration-200 cursor-pointer">
          <div>
            <div class="w-10 h-10 sm:w-12 sm:h-12 bg-orange-500 rounded-full flex items-center justify-center text-white text-base sm:text-xl font-bold mb-3 sm:mb-4 shadow-sm shadow-orange-200">$</div>
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Accounting</h3>
          </div>
          <div class="flex items-center justify-between mt-4 sm:mt-5">
            <p class="text-xs sm:text-sm text-gray-400">158 Jobs Opened</p>
            <span class="text-slate-600 text-base sm:text-lg">→</span>
          </div>
        </article>

        <!-- Photography -->
        <article class="group bg-white p-4 sm:p-5 lg:p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between min-h-[160px] sm:min-h-[180px] lg:h-56 hover:shadow-md hover:border-orange-200 transition-all duration-200 cursor-pointer">
          <div>
            <img src="assets/categories/photography.png" alt="Photography" class="w-10 h-10 sm:w-12 sm:h-12 mb-3 sm:mb-4 object-contain" width="48" height="48" />
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Photography</h3>
          </div>
          <div class="flex items-center justify-between mt-4 sm:mt-5">
            <p class="text-xs sm:text-sm text-gray-400">95 Jobs Opened</p>
            <span class="text-slate-400 text-base sm:text-lg group-hover:text-slate-600 transition-colors">→</span>
          </div>
        </article>

        <!-- Copy Writing -->
        <article class="group bg-white p-4 sm:p-5 lg:p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between min-h-[160px] sm:min-h-[180px] lg:h-56 hover:shadow-md hover:border-orange-200 transition-all duration-200 cursor-pointer">
          <div>
            <img src="assets/categories/copy-writing.png" alt="Copy Writing" class="w-10 h-10 sm:w-12 sm:h-12 mb-3 sm:mb-4 object-contain" width="48" height="48" />
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Copy Writing</h3>
          </div>
          <div class="flex items-center justify-between mt-4 sm:mt-5">
            <p class="text-xs sm:text-sm text-gray-400">113 Jobs Opened</p>
            <span class="text-slate-400 text-base sm:text-lg group-hover:text-slate-600 transition-colors">→</span>
          </div>
        </article>

        <!-- Music -->
        <article class="group bg-white p-4 sm:p-5 lg:p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between min-h-[160px] sm:min-h-[180px] lg:h-56 hover:shadow-md hover:border-orange-200 transition-all duration-200 cursor-pointer">
          <div>
            <img src="assets/categories/music.png" alt="Music" class="w-10 h-10 sm:w-12 sm:h-12 mb-3 sm:mb-4 object-contain" width="48" height="48" />
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Music</h3>
          </div>
          <div class="flex items-center justify-between mt-4 sm:mt-5">
            <p class="text-xs sm:text-sm text-gray-400">55 Jobs Opened</p>
            <span class="text-slate-400 text-base sm:text-lg group-hover:text-slate-600 transition-colors">→</span>
          </div>
        </article>

        <!-- Human Resources -->
        <article class="group bg-white p-4 sm:p-5 lg:p-6 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between min-h-[160px] sm:min-h-[180px] lg:h-56 hover:shadow-md hover:border-orange-200 transition-all duration-200 cursor-pointer">
          <div>
            <img src="assets/categories/human-resource.png" alt="Human Resources" class="w-10 h-10 sm:w-12 sm:h-12 mb-3 sm:mb-4 object-contain" width="48" height="48" />
            <h3 class="font-bold text-slate-800 text-base sm:text-lg">Human Resources</h3>
          </div>
          <div class="flex items-center justify-between mt-4 sm:mt-5">
            <p class="text-xs sm:text-sm text-gray-400">25 Jobs Opened</p>
            <span class="text-slate-400 text-base sm:text-lg group-hover:text-slate-600 transition-colors">→</span>
          </div>
        </article>

        <!-- Explore More -->
        <article class="bg-orange-500 p-4 sm:p-5 lg:p-6 rounded-xl shadow-sm hover:bg-orange-600 transition-colors min-h-[160px] sm:min-h-[180px] lg:h-56 text-white flex items-center justify-between relative overflow-hidden cursor-pointer xs:col-span-2 lg:col-span-1">
          <div class="absolute inset-0 opacity-10 bg-[linear-gradient(45deg,#fff_10%,transparent_10%),linear-gradient(-45deg,#fff_10%,transparent_10%)] bg-[size:20px_20px]"></div>

          <div class="relative z-10">
            <h3 class="font-bold text-lg sm:text-xl leading-snug">
              Explore<br />30 More<br />Categories
            </h3>
          </div>
          <div class="relative z-10 text-white font-bold text-lg sm:text-xl shrink-0 ml-4">→</div>
        </article>

      </div>
    </div>
  </section>

</body>
</html>
